datasets:
  pilot: ../data/pilot_dataset
  main: ../data/dataset

results:
  smoke: ../results/smoke
  pilot: ../results/pilot
  main: ../results/main

prompts:
  hiring: ../prompts/common/hiring.txt
  negotiation: ../prompts/common/negotiation.txt
  ownership: ../prompts/common/ownership.txt

models:
  llm:
    alias: qwen3-7-flash
    provider: aitunnel
    api_model_id: qwen3.7-flash
    api_url: https://api.aitunnel.ru/v1/chat/completions
    secret_env: AITUNNEL_API_KEY
    timeout_seconds: 120
    parameters:
      max_tokens: 16
      reasoning:
        effort: none
        exclude: true
  decision:
    alias: clef
    provider: aitunnel
    api_model_id: clef
    api_url: https://api.aitunnel.ru/v1/decisions
    secret_env: AITUNNEL_API_KEY
    timeout_seconds: 120
    parameters: {}

execution:
  max_attempts: 2
